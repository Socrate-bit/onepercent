name: onepercent
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  audioplayers: ^6.7.1
  bloc_test: ^10.0.0
  cloud_firestore: ^6.6.0
  confetti: ^0.8.0
  crypto: ^3.0.6
  equatable: ^2.0.7
  firebase_auth: ^6.3.0
  firebase_core: ^4.11.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  mocktail: ^1.0.5
  sign_in_with_apple: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

# App launcher icons (iOS only) — run: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: false
  ios: true
  remove_alpha_ios: true # App Store icons must be opaque (no alpha)
  background_color_ios: "#000000"

# Native splash screen (iOS only) — run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B0F14" # AppColors.background
  image: assets/splash_screen.png
  ios_content_mode: scaleAspectFill
  android: false
  web: false
